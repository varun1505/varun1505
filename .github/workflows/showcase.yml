name: Update project list

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_showcase.py
      - .github/workflows/showcase.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the list
        run: python3 scripts/update_showcase.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the list changed
        run: |
          if git diff --quiet README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update project list" README.md
          git push
